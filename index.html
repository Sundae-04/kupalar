<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HTML AR Demo</title>
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>
  <style>
    body { margin: 0; overflow: hidden; }
    #menu {
      position: fixed; top: 10px; left: 10px; z-index: 999;
      background: rgba(0,0,0,.65); color: #fff; padding: 8px 12px;
      font-family: sans-serif; font-size: 14px; border-radius: 8px;
    }
    #menu button {
      margin: 3px 2px; padding: 4px 8px; border: 0;
      border-radius: 5px; cursor: pointer;
    }
  </style>
</head>
<body>

<div id="menu">
  Shape:
  <button onclick="setShape('box')">Box</button>
  <button onclick="setShape('sphere')">Sphere</button>
  <button onclick="setShape('cylinder')">Cylinder</button>
  <button onclick="setShape('cone')">Cone</button>
  <br>Color:
  <button onclick="setColor('#e74c3c')" style="background:#e74c3c">Red</button>
  <button onclick="setColor('#3498db')" style="background:#3498db">Blue</button>
  <button onclick="setColor('#2ecc71')" style="background:#2ecc71">Green</button>
  <button onclick="setColor('#f1c40f')" style="background:#f1c40f">Gold</button>
</div>

<a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;" vr-mode-ui="enabled: false">

  <a-marker preset="hiro">

    <a-entity id="obj"
      geometry="primitive: box"
      material="color: #e74c3c; metalness: 0.3"
      position="0 0.5 0"
      scale="0.8 0.8 0.8"
      animation="property: rotation; to: 0 360 0; loop: true; dur: 5000; easing: linear">
    </a-entity>

    <a-text value="Hello AR!" align="center" color="#ffffff"
            position="0 1.6 0" scale="2 2 2" rotation="-90 0 0"></a-text>

  </a-marker>

  <a-entity camera></a-entity>
</a-scene>

<script>
  function setShape(shape) {
    document.getElementById('obj').setAttribute('geometry', 'primitive', shape);
  }
  function setColor(color) {
    document.getElementById('obj').setAttribute('material', 'color', color);
  }
</script>

</body>
</html>
